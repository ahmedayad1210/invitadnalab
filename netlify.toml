# invitadna.com — the public Invita DNA Lab website.
#
# Nothing here handles patient data. The booking form only opens WhatsApp with
# the visitor's details pre-filled; no submission reaches a server, Airtable or
# the report database.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"

# Netlify detects Next.js and applies its runtime automatically; naming it here
# makes the dependency explicit rather than implicit in the build image.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# This site is meant to be found, so no X-Robots-Tag. The rest matches the
# security headers on the intake form (invitadna repository).
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
